# Build, test and assemble the app on every push.
#
# Until this existed the 250-test suite and the Go helper's golden tests ran
# by hand, in order, by a person -- and the canaries that only fail on a
# grammar bump (QueryContractTests, GrammarABITests) fired only when someone
# remembered to run them. This is the cheapest place to hang them.
#
# arm64 only. A universal build compiles tree-sitter-sql's 41.6 MB parser.c a
# second time, which is a release-time cost, not a per-push one.
name: CI

on:
  push:
    branches: [development, early-release, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Package.resolved is the only record of which grammar commits are in
      # play, so it is the right cache key: a bump invalidates the cache, a
      # code change does not.
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - run: swift build
      - run: swift test
      - run: go test ./tools/jsonfmt
      - run: ./build.sh

  # A tag is a release, and the app must say so: the version in Info.plist has
  # to equal the tag. build.sh --zip enforces the same thing locally.
  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Info.plist says $version but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
